
services:
  postgres:
    image: postgres:16
    container_name: evidencegraph-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: evidencegraph
      POSTGRES_PASSWORD: evidencegraph
      POSTGRES_DB: evidencegraph

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U evidencegraph -d evidencegraph
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
