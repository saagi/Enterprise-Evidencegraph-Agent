
services:
  postgres:
    image: postgres:16
    container_name: evidencegraph-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: evidencegraph
      POSTGRES_PASSWORD: evidencegraph
      POSTGRES_DB: evidencegraph

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U evidencegraph -d evidencegraph
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: evidencegraph-neo4j
    restart: unless-stopped

    
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    healthcheck:
      test:
        - CMD-SHELL
        - 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
